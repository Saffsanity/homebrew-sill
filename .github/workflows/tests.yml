# The tap workflow `brew tap-new` writes (Homebrew 7.0.8), for a tap that holds casks only:
# no bottles, so no `--only-formulae` step and no artifact, and macOS alone, as Sill is a Mac app.
# There is no actions/checkout step: setup-homebrew fetches this repository at the commit under
# test into its tap folder itself (and empties the workspace first).
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # Downloads Sill.dmg and checks its SHA-256, the version against the latest GitHub release
      # and the minimum macOS against the app's Info.plist.
      - name: Audit the cask online
        run: brew audit --cask --online --strict saffsanity/sill/sill
